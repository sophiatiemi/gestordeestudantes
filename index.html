<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Câmera Jovi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main id="camera-screen">
    <video id="preview" autoplay playsinline muted></video>

    <div id="flash-overlay"></div>

    <div class="top-bar">
      <button id="flash-toggle" class="icon-btn" aria-label="Flash" aria-pressed="false">⚡</button>
      <button class="icon-btn deco pill" aria-label="HDR" tabindex="-1">HDR</button>
      <button class="icon-btn deco" aria-label="Timer" tabindex="-1">⏱</button>
      <button class="icon-btn deco" aria-label="Configurações" tabindex="-1">⚙</button>
    </div>

    <div class="zoom-bar deco">
      <span>.5</span>
      <span class="zoom-active">1x</span>
      <span>2</span>
      <span>3</span>
    </div>

    <!-- Painel de estilos: fica escondido abaixo da tela e sobe ao arrastar a alça "Novo Estilo" -->
    <div id="style-panel">
      <div class="style-panel-tabs">
        <button class="style-tab active" data-tab="prontos">Estilos prontos</button>
        <button class="style-tab" data-tab="favoritos">Favoritos</button>
        <button class="style-tab" data-tab="recentes">Recentes</button>
        <button id="close-style-panel" aria-label="Fechar estilos">✕</button>
      </div>
      <div id="style-strip" class="style-strip"></div>
    </div>

    <div class="mode-tabs-wrap">
      <div class="mode-tabs">
        <span data-mode="video">VÍDEO</span>
        <span data-mode="foto" class="active">FOTO</span>
        <span data-mode="estilos">ESTILOS</span>
        <span data-mode="mais">MAIS</span>
      </div>
    </div>

    <div class="bottom-bar">
      <button id="thumbnail" class="thumb-btn" aria-label="Última foto" disabled></button>
      <button id="shutter" class="shutter-btn" aria-label="Tirar foto"></button>
      <button id="flip-camera" class="icon-btn flip-btn" aria-label="Trocar câmera">⟳</button>
    </div>

    <button id="style-handle" aria-label="Arraste para ver os estilos">
      <span class="chevron">⌃</span>
      <span>Novo Estilo</span>
    </button>

    <div id="permission-overlay">
      <div class="permission-card">
        <p id="permission-text">Esta demonstração usa a câmera do seu celular.<br />Nenhuma foto é salva ou enviada — tudo acontece só no seu navegador.</p>
        <button id="start-camera">Ativar câmera</button>
      </div>
    </div>
  </main>

  <div id="review-screen" class="hidden">
    <img id="review-photo" alt="Foto capturada" />
    <button id="close-review" aria-label="Voltar para a câmera">✕</button>
  </div>

  <canvas id="capture-canvas" class="hidden"></canvas>

  <script src="camera.js"></script>
</body>
</html>
