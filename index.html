<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Câmera Jovi</title>
  <link rel="stylesheet" href="style.css?v=24" />
</head>
<body>

  <main id="camera-screen">
    <video id="preview" autoplay playsinline muted></video>

    <div id="flash-overlay"></div>

    <div id="grid-overlay" aria-hidden="true">
      <span class="gl v1"></span><span class="gl v2"></span>
      <span class="gl h1"></span><span class="gl h2"></span>
    </div>

    <div id="focus-box" aria-hidden="true">
      <span class="tick t"></span><span class="tick r"></span><span class="tick b"></span><span class="tick l"></span>
      <span class="cross"></span>
    </div>

    <div class="top-bar glass">
      <button id="flash-toggle" class="top-icon" aria-label="Flash" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
          <line class="off-slash" x1="3" y1="3" x2="21" y2="21" />
        </svg>
      </button>

      <button class="top-icon deco" aria-label="Live Photo desativado" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7.5" stroke-dasharray="1.6 1.9" />
          <circle cx="12" cy="12" r="4" />
          <line x1="4" y1="4" x2="20" y2="20" />
        </svg>
      </button>

      <span class="top-ev deco" aria-label="Exposição 0,0">0,0<small>EV</small></span>

      <button class="top-icon deco accent" aria-label="Formato" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="3" y="8" width="11" height="11" rx="2" />
          <path d="M7 8V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-2" />
          <path d="M11 4V3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2" />
        </svg>
      </button>
    </div>

    <div class="zoom-bar-wrap">
      <div class="zoom-bar">
        <button data-zoom="0.5">0,5</button>
        <button data-zoom="1" class="active">1×</button>
        <button data-zoom="1.5">1,5</button>
      </div>
    </div>

    <!-- Painel de estilos: sobe ao tocar na aba "Estilos" -->
    <div id="style-panel" class="glass">
      <div class="style-panel-tabs">
        <button class="style-tab active" data-tab="prontos">Estilos prontos</button>
        <button class="style-tab" data-tab="favoritos">Favoritos</button>
        <button class="style-tab" data-tab="recentes">Recentes</button>
        <button id="close-style-panel" aria-label="Fechar estilos">✕</button>
      </div>
      <div id="style-strip" class="style-strip"></div>
    </div>

    <!-- Menu dos 6 pontinhos: ícones da câmera anterior -->
    <div id="options-menu" class="glass" role="menu">
      <button class="option-item" role="menuitemcheckbox" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8V5a2 2 0 0 1 2-2h3" /><path d="M16 3h3a2 2 0 0 1 2 2v3" />
          <path d="M21 16v3a2 2 0 0 1-2 2h-3" /><path d="M8 21H5a2 2 0 0 1-2-2v-3" />
        </svg>
        <span>Foco</span>
      </button>
      <button class="option-item" role="menuitemcheckbox" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" />
        </svg>
        <span>Timer</span>
      </button>
      <button class="option-item" role="menuitemcheckbox" aria-checked="false">
        <span class="option-live"><span class="live-dot"></span>LIVE</span>
        <span>Live</span>
      </button>
      <button class="option-item" role="menuitemcheckbox" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z" /><line x1="3" y1="3" x2="21" y2="21" />
        </svg>
        <span>Som</span>
      </button>
      <button class="option-item" role="menuitemcheckbox" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <polygon points="12,3 19.5,7.5 19.5,16.5 12,21 4.5,16.5 4.5,7.5" />
          <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
        </svg>
        <span>Ajustes</span>
      </button>
    </div>

    <div class="shutter-row">
      <button id="shutter" class="shutter-btn" aria-label="Tirar foto"></button>
      <button id="options-toggle" class="glass options-btn" aria-label="Mais opções" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="6" cy="9" r="1.9" /><circle cx="12" cy="9" r="1.9" /><circle cx="18" cy="9" r="1.9" />
          <circle cx="6" cy="15" r="1.9" /><circle cx="12" cy="15" r="1.9" /><circle cx="18" cy="15" r="1.9" />
        </svg>
      </button>
      <button id="jo-open-btn" class="glass jo-round-btn" aria-label="Novo estilo com a Jô">
        <svg class="jo-mark" viewBox="0 0 330.329 164.023" aria-hidden="true">

          <path fill="currentColor" d="M 241.683594 29.914062 C 241.683594 32.730469 239.402344 35.011719 236.589844 35.011719 L 227.472656 35.011719 C 224.660156 35.011719 222.378906 32.730469 222.378906 29.914062 L 222.378906 24.820312 C 222.378906 22.007812 224.660156 19.726562 227.472656 19.726562 L 236.589844 19.726562 C 239.402344 19.726562 241.683594 22.007812 241.683594 24.820312 Z M 253.910156 0 L 190.84375 0 C 189.414062 3.738281 188.691406 7.765625 188.691406 12.089844 C 188.691406 21.371094 191.984375 29.308594 198.574219 35.894531 C 205.160156 42.480469 213.09375 45.773438 222.378906 45.773438 C 231.660156 45.773438 239.59375 42.480469 246.183594 35.894531 C 252.769531 29.308594 256.0625 21.371094 256.0625 12.089844 C 256.0625 7.765625 255.339844 3.738281 253.910156 0" />
          <path fill="#1c1c1e" d="M 279.917969 123.03125 C 278.492188 123.03125 277.136719 122.902344 275.855469 122.644531 C 274.574219 122.386719 273.367188 122 272.230469 121.480469 L 273.253906 118.320312 C 274.101562 118.671875 274.894531 118.964844 275.640625 119.203125 C 276.382812 119.441406 277.113281 119.609375 277.824219 119.714844 C 278.539062 119.820312 279.265625 119.871094 280.011719 119.871094 C 281.394531 119.871094 282.507812 119.683594 283.359375 119.3125 C 284.207031 118.941406 284.824219 118.347656 285.21875 117.53125 C 285.609375 116.714844 285.808594 115.652344 285.808594 114.351562 L 285.808594 100.09375 L 289.277344 100.09375 L 289.277344 114.972656 C 289.277344 117.71875 288.523438 119.75 287.015625 121.0625 C 285.507812 122.375 283.140625 123.03125 279.917969 123.03125" />
          <path fill="#1c1c1e" d="M 295.757812 97.921875 L 300.53125 91.105469 L 304.652344 91.105469 L 309.457031 97.921875 L 305.429688 97.921875 L 302.636719 93.582031 L 302.578125 93.582031 L 299.789062 97.921875 Z M 302.578125 119.933594 C 304.3125 119.933594 305.804688 119.585938 307.054688 118.894531 C 308.304688 118.199219 309.273438 117.21875 309.953125 115.949219 C 310.636719 114.675781 310.976562 113.164062 310.976562 111.40625 C 310.976562 109.652344 310.636719 108.136719 309.953125 106.867188 C 309.273438 105.59375 308.304688 104.613281 307.054688 103.921875 C 305.804688 103.230469 304.3125 102.882812 302.578125 102.882812 C 300.839844 102.882812 299.347656 103.230469 298.097656 103.921875 C 296.847656 104.613281 295.882812 105.59375 295.199219 106.867188 C 294.519531 108.136719 294.175781 109.652344 294.175781 111.40625 C 294.175781 113.164062 294.519531 114.675781 295.199219 115.949219 C 295.882812 117.21875 296.847656 118.199219 298.097656 118.894531 C 299.347656 119.585938 300.839844 119.933594 302.578125 119.933594 M 302.609375 123.03125 C 300.191406 123.03125 298.085938 122.554688 296.300781 121.605469 C 294.511719 120.65625 293.125 119.304688 292.144531 117.558594 C 291.164062 115.8125 290.671875 113.761719 290.671875 111.40625 C 290.671875 109.03125 291.164062 106.976562 292.144531 105.238281 C 293.125 103.503906 294.511719 102.160156 296.300781 101.210938 C 298.085938 100.257812 300.191406 99.785156 302.609375 99.785156 C 305.046875 99.785156 307.15625 100.257812 308.933594 101.210938 C 310.707031 102.160156 312.089844 103.503906 313.070312 105.238281 C 314.050781 106.976562 314.542969 109.03125 314.542969 111.40625 C 314.542969 113.761719 314.050781 115.8125 313.070312 117.558594 C 312.089844 119.304688 310.707031 120.65625 308.933594 121.605469 C 307.15625 122.554688 305.046875 123.03125 302.609375 123.03125" />
        </svg>
        <svg class="sparkle s1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 6.6 17.4 11.1 24 12C17.4 12.9 12.9 17.4 12 24C11.1 17.4 6.6 12.9 0 12C6.6 11.1 11.1 6.6 12 0Z" /></svg>
        <svg class="sparkle s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 6.6 17.4 11.1 24 12C17.4 12.9 12.9 17.4 12 24C11.1 17.4 6.6 12.9 0 12C6.6 11.1 11.1 6.6 12 0Z" /></svg>
        <svg class="sparkle s3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 6.6 17.4 11.1 24 12C17.4 12.9 12.9 17.4 12 24C11.1 17.4 6.6 12.9 0 12C6.6 11.1 11.1 6.6 12 0Z" /></svg>
      </button>
    </div>

    <div class="bottom-bar">
      <button id="thumbnail" class="thumb-btn" aria-label="Última foto" disabled></button>
      <div class="mode-tabs-wrap glass">
        <div class="mode-tabs">
          <span data-mode="video">VÍDEO</span>
          <span data-mode="foto" class="active">FOTO</span>
          <span data-mode="estilos">ESTILOS</span>
          <span data-mode="mais">MAIS</span>
        </div>
      </div>
      <button id="flip-camera" class="glass round-btn" aria-label="Trocar câmera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 0 0-14.3-4.9L4 8" /><path d="M4 3v5h5" />
          <path d="M4 13a8 8 0 0 0 14.3 4.9L20 16" /><path d="M20 21v-5h-5" />
        </svg>
      </button>
    </div>


    <!-- Tela da Jô: sobe por cima da câmera ao tocar na logo da Jô lá em cima -->
    <div id="jo-panel">
      <div class="jo-topbar">
        <button class="jo-icon-btn" aria-label="Menu" tabindex="-1">☰</button>
        <button id="jo-collapse" class="jo-collapse" aria-label="Voltar para a câmera">⌄</button>
        <div class="jo-right-cluster">
          <button class="jo-icon-btn jo-edit-btn" aria-label="Editar" tabindex="-1">✏️</button>
          <button id="jo-test" class="jo-test-btn" aria-label="Testar na câmera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8h2l1.5-2h9L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
              <circle cx="12" cy="13.5" r="3.2" />
            </svg>
            Testar
          </button>
        </div>
      </div>

      <div id="jo-body">
        <div id="jo-idle">
          <div class="jo-logo" id="jo-logo-idle">
            <img class="jo-logo-video" src="media/jo-loading.png" alt="" />
          </div>
          <p>Qual a próxima foto?</p>
        </div>

        <div id="jo-messages"></div>
      </div>

      <form id="jo-input-bar">
        <button type="button" class="jo-attach" aria-label="Anexar" tabindex="-1">+</button>
        <input type="text" id="jo-input" placeholder="Qual a sua ideia?" autocomplete="off" />
        <button type="button" class="jo-mic" aria-label="Voz" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
        </button>
        <button type="button" id="jo-send" class="jo-send" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.4 20.6 21 12 3.4 3.4 3 10l13 2-13 2z" />
          </svg>
        </button>
      </form>
    </div>

    <div id="permission-overlay">
      <div class="permission-card">
        <p id="permission-text">Esta demonstração usa a câmera do seu celular.<br />Nenhuma foto é salva ou enviada — tudo acontece só no seu navegador.</p>
        <button id="start-camera">Ativar câmera</button>
      </div>
    </div>
  </main>

  <div id="review-screen" class="hidden">
    <img id="review-photo" alt="Foto capturada" />

    <button id="close-review" class="glass round-btn review-back" aria-label="Voltar para a câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5" />
        <path d="M11 18 5 12l6-6" />
      </svg>
    </button>

    <div class="top-bar glass" aria-hidden="true">
      <span class="top-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
          <line x1="3" y1="3" x2="21" y2="21" />
        </svg>
      </span>
      <span class="top-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7.5" stroke-dasharray="1.6 1.9" />
          <circle cx="12" cy="12" r="4" />
          <line x1="4" y1="4" x2="20" y2="20" />
        </svg>
      </span>
      <span class="top-ev">0,0<small>EV</small></span>
      <span class="top-icon accent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="3" y="8" width="11" height="11" rx="2" />
          <path d="M7 8V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-2" />
          <path d="M11 4V3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2" />
        </svg>
      </span>
    </div>
  </div>

  <canvas id="capture-canvas" class="hidden"></canvas>

  <script src="camera.js?v=24"></script>
</body>
</html>
